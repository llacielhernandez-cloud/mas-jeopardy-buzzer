<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>MAS Jeopardy Buzzer</title>
<style>
  @font-face{font-family:"Barlow Condensed";src:url(assets/fonts/BarlowCondensed-ExtraBold.woff) format("woff");font-weight:800;font-display:block}
  @font-face{font-family:"Barlow Condensed";src:url(assets/fonts/BarlowCondensed-BlackItalic.woff) format("woff");font-weight:900;font-style:italic;font-display:block}
  @font-face{font-family:"Barlow";src:url(assets/fonts/Barlow-Regular.woff) format("woff");font-weight:400;font-display:swap}
  @font-face{font-family:"Barlow";src:url(assets/fonts/Barlow-SemiBold.woff) format("woff");font-weight:600;font-display:swap}
  @font-face{font-family:"Barlow";src:url(assets/fonts/Barlow-Bold.woff) format("woff");font-weight:700;font-display:swap}
  :root{
    --bg:#070707;--panel:#111;--line:#2a2a2a;--red:#e3141b;--red-hot:#ff3b3b;--text:#f4f4f4;--muted:#a3a3a3;--good:#22c55e;
    --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",Arial,sans-serif;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{color-scheme:dark}
  ::selection{background:var(--red);color:#fff}
  body{
    background:radial-gradient(ellipse at 50% 30%,#2a0304 0%,#0a0000 60%,#000 100%) fixed,var(--bg);
    color:var(--text);font-family:var(--body);letter-spacing:.005em;
    min-height:100dvh;display:flex;flex-direction:column;
    padding:max(var(--s4),env(safe-area-inset-top)) var(--s4) max(var(--s4),env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
  header{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
  .logo{height:34px;width:auto}
  .code{font:700 13px var(--body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .code b{color:var(--text)}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s5);text-align:center;width:min(460px,100%);margin:0 auto}
  [hidden]{display:none!important}

  /* join */
  h1{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(40px,12vw,64px);line-height:.9}
  h1 span{color:var(--red-hot)}
  .lead{color:var(--muted);line-height:1.5;max-width:32ch}
  form{display:flex;flex-direction:column;gap:var(--s3);width:100%}
  label{display:flex;flex-direction:column;gap:var(--s2);text-align:left;font:600 14px var(--body);color:var(--muted)}
  input{
    font:800 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--text);caret-color:var(--red);
    background:#111;border:1px solid var(--line);border-radius:10px;padding:14px var(--s4);width:100%;
  }
  input:focus{outline:none;border-color:var(--red)}
  .btn{
    font:700 17px var(--body);letter-spacing:.02em;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#d8121a,#8d0509);border:1px solid rgba(255,90,90,.35);
    padding:15px var(--s5);border-radius:10px;width:100%;
  }
  .btn:disabled{opacity:.5;cursor:default}
  .err{color:var(--red-hot);font-weight:600;min-height:1.4em}
  #cancelBtn{align-self:center;padding:var(--s2)}

  /* play */
  .team{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(26px,8vw,40px);line-height:1;display:flex;align-items:center;gap:var(--s3);justify-content:center;flex-wrap:wrap}
  .link{background:none;border:none;color:var(--muted);font:500 14px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;letter-spacing:0;text-transform:none}
  .clue{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--red-hot);font-size:20px;min-height:1.2em}
  .clue .v{color:var(--text);font-weight:900;font-style:italic;letter-spacing:.01em;margin-left:.4em}
  .fjp{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:var(--s3);text-align:center}
  .fjp-title{font:900 italic clamp(36px,11vw,54px)/.95 var(--display);text-transform:uppercase;color:var(--red-hot)}
  .fjp-cat{font:800 clamp(24px,7vw,32px)/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;text-wrap:balance}
  .fjp-body{display:flex;flex-direction:column;gap:var(--s3)}
  .fjp-note{color:var(--muted);font:600 15px/1.45 var(--body)}
  .fjp-big{font:900 italic clamp(28px,9vw,40px)/1.05 var(--display);text-transform:uppercase}
  .fjp-big.good{color:var(--good)} .fjp-big.bad{color:var(--red-hot)}
  .fjp-money{display:flex;flex-direction:row;align-items:center;gap:var(--s2);background:#111;border:1px solid var(--line);border-radius:10px;padding:0 var(--s4)}
  .fjp-money:focus-within{border-color:var(--red)}
  .fjp-money span{font:900 italic 34px var(--display);color:var(--muted)}
  .fjp-money input{flex:1;min-width:0;width:auto;border:none;background:transparent;padding:14px 0;font:900 italic 34px/1 var(--display);font-variant-numeric:tabular-nums}
  .fjp-money input:focus{outline:none}
  .fjp textarea{font:800 22px/1.2 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--text);caret-color:var(--red);background:#111;border:1px solid var(--line);border-radius:10px;padding:14px var(--s4);width:100%;min-height:110px;resize:vertical}
  .fjp textarea:focus{outline:none;border-color:var(--red)}
  .toss{width:100%;display:flex;flex-direction:column;align-items:center;gap:var(--s3);text-align:center}
  .coin-stage{height:210px;display:grid;place-items:center;perspective:1000px}
  .coin-hop{filter:drop-shadow(0 18px 22px rgba(0,0,0,.55))}
  .coin{--d:170px;width:var(--d);height:var(--d);position:relative;transform-style:preserve-3d}
  .ce{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,#e3e6ea 0deg 1.2deg,#8a9098 1.2deg 2.4deg,#4f555c 2.4deg 3.6deg)}
  .cface{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(6px);
    background:conic-gradient(from 210deg,rgba(255,255,255,.55),rgba(20,22,26,.45) 25%,rgba(255,255,255,.5) 50%,rgba(20,22,26,.4) 75%,rgba(255,255,255,.55)),repeating-conic-gradient(from 0deg,#f4f6f8 0deg 1.2deg,#b3b9c0 1.2deg 2.4deg,#6c727a 2.4deg 3.6deg);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 0 0 3px rgba(40,44,50,.5)}
  .cface.tails{transform:rotateX(180deg) translateZ(6px)}
  .crim{position:absolute;inset:10px;border-radius:50%;background:conic-gradient(from 200deg,#f7f8fa,#9aa1a9 20%,#e4e7eb 38%,#7c828a 55%,#eef0f3 72%,#a3a9b1 88%,#f7f8fa);box-shadow:0 0 0 2px #5d636a,0 0 0 3px rgba(255,255,255,.6),inset 0 1px 2px rgba(255,255,255,.9),inset 0 -2px 3px rgba(0,0,0,.45)}
  .cimg{position:absolute;inset:17px;border-radius:50%;overflow:hidden;background:#050505;box-shadow:0 0 0 2px #4b5057,inset 0 4px 12px rgba(0,0,0,.85)}
  .cimg img{width:100%;height:100%;object-fit:cover;display:block}
  .cimg::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(140deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 68%,rgba(255,255,255,.08) 100%);box-shadow:inset 0 4px 12px rgba(0,0,0,.7)}
  .toss-res{font:900 italic clamp(26px,8vw,34px)/1.05 var(--display);text-transform:uppercase;min-height:1.1em}
  .toss-res.good{color:var(--good)} .toss-res.bad{color:var(--red-hot)}
  .call-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);width:100%}
  .call{font:900 italic clamp(26px,8vw,34px)/1 var(--display);text-transform:uppercase;color:#fff;cursor:pointer;border-radius:12px;padding:18px 0;border:none;
    background:linear-gradient(160deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 38%),linear-gradient(180deg,#c70f15 0%,#8d0509 60%,#5a0205 100%);
    text-shadow:0 3px 0 rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,90,90,.35),0 4px 10px rgba(0,0,0,.5)}
  .call:active:not(:disabled){transform:translateY(2px)}
  .call:disabled{opacity:.45;cursor:default}
  .tally{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:34px}
  .tally span{width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px dashed #444}
  .tally span img{width:100%;height:100%;object-fit:cover;display:block}
  .tally span.hit{border:3px solid var(--good)} .tally span.miss{border:3px solid var(--bad)}
  .tally span.miss img{filter:grayscale(.85) brightness(.75)}
  .pickpanel{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:var(--s3);text-align:center}
  .pick-title{font:900 italic clamp(32px,10vw,48px)/1 var(--display);text-transform:uppercase;color:var(--good)}
  .pick-sub{color:var(--muted);font:600 15px var(--body);min-height:1.3em}
  .pick-list{display:grid;gap:var(--s2)}
  .pick-list.vals{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
  .cat-btn{
    font:800 clamp(20px,6vw,26px)/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#1d1d1d,#121212);border:1px solid #333;border-bottom:3px solid var(--red);border-radius:10px;padding:14px var(--s4);
    display:flex;justify-content:space-between;align-items:center;gap:var(--s3);text-align:left;
  }
  .cat-btn small{font:600 13px var(--body);color:var(--muted);letter-spacing:0;text-transform:none;white-space:nowrap}
  .cat-btn:active:not(:disabled){transform:translateY(1px)}
  .cat-btn:disabled{opacity:.4;cursor:default;border-bottom-color:#333}
  .val-btn{
    font:900 italic clamp(30px,9vw,40px)/1 var(--display);color:#fff;cursor:pointer;border:none;border-radius:10px;padding:16px 0;
    background:linear-gradient(160deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 38%),linear-gradient(180deg,#c70f15 0%,#8d0509 60%,#5a0205 100%);
    text-shadow:0 3px 0 rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,90,90,.35),0 4px 10px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;
  }
  .val-btn:active:not(:disabled){transform:translateY(2px)}
  .val-btn:disabled{opacity:.6;cursor:default}
  #pickBack{align-self:center;padding:var(--s2)}
  .buzz{
    --size:min(72vw,50dvh,330px);
    width:var(--size);height:var(--size);border-radius:50%;border:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;
    font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:calc(var(--size)*.2);letter-spacing:.02em;color:#fff;
    background:radial-gradient(circle at 50% 35%,#ff3b3b 0%,#c70f15 45%,#6a0306 100%);
    box-shadow:inset 0 -10px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,140,140,.45),0 14px 30px rgba(0,0,0,.6);
    text-shadow:0 4px 0 rgba(0,0,0,.4);
    transition:transform .1s,filter .15s,background .2s,color .2s;
  }
  .buzz:active:not(:disabled){transform:translateY(4px) scale(.98);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,140,140,.45),0 6px 14px rgba(0,0,0,.6)}
  .buzz:disabled{cursor:default;background:radial-gradient(circle at 50% 35%,#2a2a2a 0%,#161616 60%,#0c0c0c 100%);color:#8a8a8a;text-shadow:none;box-shadow:inset 0 -8px 0 rgba(0,0,0,.4),inset 0 0 0 2px #2a2a2a,0 10px 24px rgba(0,0,0,.6)}
  .buzz.up{background:radial-gradient(circle at 50% 35%,#4ade80 0%,#16a34a 50%,#0b4d24 100%);color:#fff;box-shadow:inset 0 -10px 0 rgba(0,0,0,.3),inset 0 0 0 3px rgba(160,255,190,.5),0 14px 30px rgba(0,0,0,.6)}
  .buzz.pending{filter:brightness(.8)}
  .status{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(22px,6.5vw,30px);line-height:1.1;min-height:2.2em;text-wrap:balance}
  .status.good{color:var(--good)} .status.bad{color:var(--red-hot)}
  .hint{color:#8c8c8c;font-size:14px}
  @media (hover:none){.hint{display:none}}
  footer{display:flex;justify-content:center;align-items:center;gap:var(--s2);color:var(--muted);font-size:13px;padding-top:var(--s3)}
  .dot{width:8px;height:8px;border-radius:50%;background:#666}
  .dot.live{background:var(--good)} .dot.bad{background:var(--red-hot)}
  @media (prefers-reduced-motion:reduce){.buzz{transition:none}.buzz:active:not(:disabled){transform:none}}
  /* team look: avatars + signatures */
  .av{--av:48px;width:var(--av);height:var(--av);border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
      background:#1a0506;box-shadow:inset 0 0 0 2px rgba(255,120,120,.45),0 2px 6px rgba(0,0,0,.5)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .av.ico{background:radial-gradient(circle at 50% 32%,#ef2a30 0%,#a80a10 55%,#4a0204 100%);color:#fff}
  .av .glyph{width:74%;height:74%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .av .glyph .f{fill:currentColor;stroke:none}
  .av.ini{font:900 italic calc(var(--av)*.44)/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:#fff;background:linear-gradient(180deg,#2c2c2c,#141414);letter-spacing:.02em;padding-right:.06em}
  .sig{display:block;height:var(--sig-h,30px);width:auto;max-width:100%;overflow:visible}
  .sig path{fill:none;stroke:#fff;stroke-width:var(--sig-w,2.6px);stroke-linecap:round;stroke-linejoin:round}

  /* join: signature + picture */
  .field{display:flex;flex-direction:column;gap:var(--s2);text-align:left}
  .field-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);font:600 14px var(--body);color:var(--muted)}
  .pad{position:relative;height:150px;border-radius:10px;background:linear-gradient(180deg,#140304,#0b0b0b);border:1px solid var(--line);overflow:hidden;transition:border-color .15s}
  .pad.active{border-color:var(--red)}
  .pad::before{content:"";position:absolute;left:var(--s4);right:var(--s4);top:72%;border-top:1px dashed #4a1a1c;pointer-events:none}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}   /* drawing surface runs edge to edge on purpose */
  .pad-hint{position:absolute;inset:0;display:grid;place-items:center;padding:0 var(--s4);color:#7a7a7a;font:600 15px var(--body);text-align:center;pointer-events:none}
  .pics{border:none;padding:0;margin:0;display:flex;flex-direction:column;gap:var(--s2);text-align:left;min-width:0}
  .pics legend{font:600 14px var(--body);color:var(--muted);margin-bottom:var(--s2);padding:0}
  .pic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:var(--s2)}
  .pick{display:grid;place-items:center;aspect-ratio:1;border-radius:12px;background:#111;border:1px solid var(--line);cursor:pointer;padding:4px;color:var(--muted);transition:border-color .15s,background-color .15s}
  .pick:hover{border-color:#555}
  .pick[aria-pressed="true"]{border-color:#fff;background:#1d0a0b;box-shadow:inset 0 0 0 2px var(--red)}
  .pick .av{--av:46px}
  .pick.photo{gap:2px;font:600 12px var(--body)}
  .pick.photo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* play: the team's own look */
  .me{display:flex;flex-direction:column;align-items:center;gap:var(--s2)}
  .me .av{--av:64px}
  #teamName{display:flex;justify-content:center;max-width:100%}
  #teamName .sig{--sig-h:54px;--sig-w:3px;max-width:min(82vw,420px)}
</style>
</head>
<body>
<header>
  <img class="logo" src="assets/mas-logo.png" alt="MAS mobile auto solutions">
  <div class="code" id="codeTag" hidden>Game <b id="codeTxt"></b></div>
</header>

<main id="joinView">
  <h1>MAS <span>Jeopardy</span></h1>
  <p class="lead" id="joinLead">Join with your team name. Your screen becomes your buzzer.</p>
  <form id="joinForm" autocomplete="off">
    <label id="codeField">Game code<input id="codeIn" maxlength="6" inputmode="text" autocapitalize="characters" placeholder="ABCD"></label>
    <label>Team name<input id="nameIn" maxlength="24" autocapitalize="words" placeholder="Team name"></label>
    <div class="field">
      <div class="field-head"><span id="sigLabel">Sign your team name, like on the show</span><button type="button" class="link" id="sigClear">Clear</button></div>
      <div class="pad" id="pad"><canvas id="sigCanvas" aria-labelledby="sigLabel"></canvas><span class="pad-hint" id="padHint">Write it here with your finger</span></div>
    </div>
    <fieldset class="pics">
      <legend>Pick your picture</legend>
      <div class="pic-grid" id="picGrid"></div>
      <input type="file" id="photoIn" accept="image/*" hidden>
    </fieldset>
    <div class="err" id="joinErr" role="alert"></div>
    <button class="btn" id="joinBtn" type="submit">Join game</button>
    <button class="link" id="cancelBtn" type="button" hidden>Cancel, keep things as they are</button>
  </form>
</main>

<main id="playView" hidden>
  <div class="me"><span id="meAv"></span><div class="team" id="teamName"></div><button class="link" id="renameBtn" type="button">Edit team</button></div>
  <div class="clue" id="clueTxt" aria-live="polite"></div>
  <section class="fjp" id="fjPanel" hidden aria-labelledby="fjpTitle">
    <h2 class="fjp-title" id="fjpTitle">Final Jeopardy</h2>
    <div class="fjp-cat" id="fjpCat"></div>
    <div class="fjp-body" id="fjpBody"></div>
  </section>
  <section class="toss" id="tossPanel" hidden aria-labelledby="tossTitle">
    <h2 class="pick-title" id="tossTitle">Coin toss</h2>
    <p class="pick-sub" id="tossSub"></p>
    <div class="coin-stage"><div class="coin-hop" id="coinHop"><div class="coin" id="coin"><div class="ce" style="transform:translateZ(-5.00px)"></div><div class="ce" style="transform:translateZ(-3.75px)"></div><div class="ce" style="transform:translateZ(-2.50px)"></div><div class="ce" style="transform:translateZ(-1.25px)"></div><div class="ce" style="transform:translateZ(0.00px)"></div><div class="ce" style="transform:translateZ(1.25px)"></div><div class="ce" style="transform:translateZ(2.50px)"></div><div class="ce" style="transform:translateZ(3.75px)"></div><div class="ce" style="transform:translateZ(5.00px)"></div>
      <div class="cface heads"><div class="crim"></div><div class="cimg"><img src="assets/coin-heads.jpg" alt=""></div></div>
      <div class="cface tails"><div class="crim"></div><div class="cimg"><img src="assets/coin-tails.jpg" alt=""></div></div>
    </div></div></div>
    <div class="toss-res" id="tossRes" aria-live="polite"></div>
    <div class="call-row" id="callRow"><button class="call" type="button" data-c="H">Heads</button><button class="call" type="button" data-c="T">Tails</button></div>
    <div class="tally" id="tally" aria-label="Your flips"></div>
  </section>
  <section class="pickpanel" id="pickPanel" hidden aria-labelledby="pickTitle">
    <h2 class="pick-title" id="pickTitle">Your pick!</h2>
    <p class="pick-sub" id="pickSub">Choose a category</p>
    <div class="pick-list" id="pickList"></div>
    <button class="link" id="pickBack" type="button" hidden>Back to categories</button>
  </section>
  <button class="buzz" id="buzzBtn" disabled>Wait</button>
  <div class="status" id="statusTxt" aria-live="assertive"></div>
  <div class="hint">Tip: press the Space bar to buzz.</div>
</main>

<footer id="foot" hidden><span class="dot" id="dot"></span><span id="connTxt">Connecting…</span></footer>

<script>
/* ---------- Team look: premade icons, avatars, signatures (shared by board + buzzer) ---------- */
const TEAM_ICONS = {
  wrench: '<path d="M31.5 11.5a7.5 7.5 0 0 0-9.3 9.6L12.4 30.9a2.9 2.9 0 0 0 4.1 4.1l9.8-9.8a7.5 7.5 0 0 0 9.6-9.3l-4.4 4.4-3.9-.8-.8-3.9z"/>',
  tire:   '<circle cx="24" cy="24" r="13.5"/><circle cx="24" cy="24" r="8.5"/><circle cx="24" cy="24" r="2.6"/><path d="M24 10.5v3M24 34.5v3M10.5 24h3M34.5 24h3M14.5 14.5l2.1 2.1M31.4 31.4l2.1 2.1M33.5 14.5l-2.1 2.1M16.6 31.4l-2.1 2.1"/>',

/* ---------- tiny Firebase Realtime Database client (REST + streaming) ---------- */
function fb(base){
  const url = p => `${base}/${p}.json`;

    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });

    get: p => req("GET", p), put: (p,v) => req("PUT", p, v), patch: (p,v) => req("PATCH", p, v), del: p => req("DELETE", p),
    listen(p, onData, onStatus){
      let tree = null, es = null, stopped = false, wait = 1000, last = Date.now();
      const seen = () => { last = Date.now(); };
      const open = () => {
        if (stopped) return;
        if (es) es.close();
        seen();

        es.onopen = () => { wait = 1000; seen(); onStatus(navigator.onLine === false ? "connecting" : "live"); };
        es.addEventListener("put", e => { seen(); const d = JSON.parse(e.data); tree = setAt(tree, d.path, d.data); onData(tree); });

        };

      const dog = setInterval(() => { if (!stopped && Date.now() - last > 70000){ onStatus("connecting"); open(); } }, 10000);

}

    box.append(inp);
    const err = el("div", "err"); err.setAttribute("role", "alert");
    const go = el("button", "btn", "Lock in wager"); go.type = "button";
    const allIn = el("button", "link", `Bet it all ($${max.toLocaleString()})`); allIn.type = "button";
    allIn.onclick = () => { inp.value = String(max); fjDraft.wager = inp.value; inp.focus(); };
    go.onclick = async () => {
      const w = Math.floor(+inp.value || 0);
      if (inp.value === ""){ err.textContent = "Enter a wager, even if it's $0."; return; }
      if (w > max){ err.textContent = `The most you can wager is $${max.toLocaleString()}.`; return; }
      fjBusy = true; render();
      try { await db.patch(`games/${code}/finalIn/${F.id}/${me.tid}`, { wager:w, locked:true }); if (navigator.vibrate) navigator.vibrate(40); }
      catch(e){ err.textContent = "Wager didn't send. Try again."; }
      fjBusy = false; render();
    };
    inp.onkeydown = e => { if (e.key === "Enter") go.click(); };
    body.append(box, err, go, allIn);
    return;
  }
  if (F.status === "answer"){
    body.append(el("p", "fjp-note", "Read the clue on the board, then type your response. You can change it until time's up."));
    const ta = document.createElement("textarea"); ta.maxLength = 140; ta.placeholder = "What is…"; ta.value = fjDraft.resp || mine.resp || ""; ta.setAttribute("aria-label", "Your response");
    ta.oninput = () => { fjDraft.resp = ta.value; };
    const go = el("button", "btn", mine.resp ? "Update response" : "Submit response"); go.type = "button";
    const note = el("div", "fjp-note", mine.resp ? `Submitted: “${mine.resp}”` : "");
    go.onclick = async () => {
      const r = ta.value.trim(); if (!r){ ta.focus(); return; }
      fjDraft.resp = r; fjBusy = true; render();
      try { await db.patch(`games/${code}/finalIn/${F.id}/${me.tid}`, { resp:r }); if (navigator.vibrate) navigator.vibrate(40); }
      catch(e){ note.textContent = "Response didn't send. Try again."; }
      fjBusy = false; render();
    };
    body.append(ta, go, note);
    return;
  }
  if (res){
    const good = res.r === "right";
    body.append(el("div", "fjp-big " + (good ? "good" : "bad"), good ? `Correct! +$${(+res.w).toLocaleString()}` : `Incorrect. −$${(+res.w).toLocaleString()}`));
  } else body.append(el("div", "fjp-big", "Responses are in"), el("p", "fjp-note", "Watch the board for the reveal."));
}

/* ---------- coin toss ---------- */
function myTossFlips(ts){
  const o = (game.tossFlips && game.tossFlips[ts.id] && game.tossFlips[ts.id][me.tid]) || {};
  return Object.keys(o).sort().map(k => o[k]);
}
function tossInfo(){
  const ts = game && game.toss;
  if (!ts || !ts.id || ts.status !== "open") return null;
  const part = (ts.teams || []).includes(me.tid);
  const fl = part ? myTossFlips(ts) : [];
  const need = 5 + (ts.tb && (ts.tied || []).includes(me.tid) ? ts.tb : 0);
  return { ts, part, fl, need };
}
function renderToss(I){
  const { ts, part, fl, need } = I, done = fl.length >= need;
  const tbMe = ts.tb && (ts.tied || []).includes(me.tid);
  $("tossTitle").textContent = tbMe && done === false ? "Tiebreaker!" : "Coin toss";
  if (!part) $("tossSub").textContent = "The coin toss is on. Your team joined after it started.";
  else if (tossBusy) $("tossSub").textContent = "Flipping…";
  else if (!done) $("tossSub").textContent = tbMe ? "Sudden death: call it!" : `Flip ${fl.length + 1} of 5: call it!`;
  else $("tossSub").textContent = `Done: ${fl.filter(f => f.call === f.side).length} correct. Waiting for the other teams…`;
  document.querySelectorAll(".call").forEach(b => b.disabled = !part || done || tossBusy);
  $("callRow").hidden = !part || done;
  const tl = $("tally"), key = JSON.stringify(fl);
  if (tl.dataset.k !== key){
    tl.dataset.k = key; tl.replaceChildren();
    for (let i = 0; i < Math.max(5, need); i++){
      const f = fl[i], sp = document.createElement("span");
      if (f){ sp.className = f.call === f.side ? "hit" : "miss"; const im = document.createElement("img"); im.alt = ""; im.src = f.side === "H" ? "assets/coin-heads.jpg" : "assets/coin-tails.jpg"; sp.appendChild(im); }
      tl.appendChild(sp);
    }
  }
  if (!tossBusy && !lastFlip) $("tossRes").textContent = "";
}
function rand01(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] & 1; }
async function doFlip(call){
  const I = tossInfo(); if (!I || !I.part || tossBusy || I.fl.length >= I.need) return;
  tossBusy = true; lastFlip = null; $("tossRes").textContent = ""; $("tossRes").className = "toss-res"; render();
  const side = rand01() ? "H" : "T", idx = I.fl.length;
  if (navigator.vibrate) navigator.vibrate(30);
  const base = coinAngle - (((coinAngle % 360) + 360) % 360);
  const next = base + 360 * 5 + (side === "H" ? 0 : 180);
  const RMq = matchMedia("(prefers-reduced-motion: reduce)").matches, dur = RMq ? 10 : 1600;
  const coin = $("coin");
  try {
    if (!RMq) $("coinHop").animate([{transform:"translateY(0) scale(1)"},{transform:"translateY(-120px) scale(1.12)", offset:.45},{transform:"translateY(0) scale(1)"}], {duration:dur, easing:"cubic-bezier(.3,.6,.4,1)"});
    await coin.animate([{transform:`rotateX(${coinAngle}deg)`},{transform:`rotateX(${next}deg)`}], {duration:dur, easing:"cubic-bezier(.2,.7,.25,1)", fill:"forwards"}).finished;
  } catch(e){}
  coinAngle = next; coin.style.transform = `rotateX(${next}deg)`;
  coin.getAnimations().forEach(a => a.cancel());
  const win = call === side;
  lastFlip = { call, side };
  $("tossRes").textContent = (side === "H" ? "Heads" : "Tails") + (win ? "! You called it" : ". Missed this one");
  $("tossRes").className = "toss-res " + (win ? "good" : "bad");
  if (navigator.vibrate) navigator.vibrate(win ? [40, 60, 40] : 120);
  try { await db.put(`games/${code}/tossFlips/${I.ts.id}/${me.tid}/f${String(idx).padStart(2, "0")}`, { call, side }); }
  catch(e){ $("tossRes").textContent = "Flip didn't send. Try again."; $("tossRes").className = "toss-res bad"; }
  tossBusy = false; render();
}
document.querySelectorAll(".call").forEach(b => b.onclick = () => doFlip(b.dataset.c));

function renderPicker(bd){
  const list = $("pickList"), cats = bd.cats, left = bd.left || {}, vals = bd.values || [];
  const first = game.toss && game.toss.status === "done" && game.toss.winner === me.tid && Object.values(left).every(a => a.every(Boolean));
  $("pickTitle").textContent = first ? "You won the toss!" : "Your pick!";
  const key = JSON.stringify([pickCat, pickSent, left]);
  if (list.dataset.k === key) return; list.dataset.k = key;
  list.replaceChildren();
  if (pickSent){
    list.className = "pick-list"; $("pickSub").textContent = "Opening your clue…"; $("pickBack").hidden = true; return;
  }
  if (pickCat === null || !(left[pickCat] || []).some(Boolean)){
    pickCat = null; list.className = "pick-list"; $("pickSub").textContent = "Choose a category"; $("pickBack").hidden = true;
    cats.forEach((name, ci) => {
      const n = (left[ci] || []).filter(Boolean).length;
      const b = document.createElement("button"); b.type = "button"; b.className = "cat-btn"; b.disabled = !n;
      const nmS = document.createElement("span"); nmS.textContent = name;
      const sm = document.createElement("small"); sm.textContent = n ? `${n} left` : "done";
      b.append(nmS, sm); b.onclick = () => { pickCat = ci; render(); const f = $("pickList").querySelector("button"); if (f) f.focus(); };
      list.appendChild(b);
    });
  } else {
    list.className = "pick-list vals"; $("pickSub").textContent = cats[pickCat]; $("pickBack").hidden = false;
    vals.forEach((v, r) => {
      if (!(left[pickCat] || [])[r]) return;
      const b = document.createElement("button"); b.type = "button"; b.className = "val-btn"; b.textContent = "$" + v;
      b.setAttribute("aria-label", `${cats[pickCat]} for $${v}`);
      b.onclick = () => sendPick(`${pickCat}-${r}`);
      list.appendChild(b);
    });
  }
}
function sendPick(k){
  if (pickSent) return;
  pickSent = k; render();
  if (navigator.vibrate) navigator.vibrate(40);
  db.put(`games/${code}/pick`, { id: Math.random().toString(36).slice(2, 10), tid: me.tid, key: k, at:{".sv":"timestamp"} })
    .catch(() => { pickSent = null; render(); $("pickSub").textContent = "Pick didn't send. Try again."; });
  setTimeout(() => { if (pickSent === k){ pickSent = null; render(); } }, 6000);   // board didn't open it (e.g. host busy): let them pick again
}
$("pickBack").onclick = () => { pickCat = null; render(); };

/* ---------- render ---------- */
function setText(el, t){ if (el.textContent !== t) el.textContent = t; }   // don't re-announce unchanged status
function render(){
  if (!joined || renaming) return;
  const { r, mine, out } = state();
  const t = (game && game.teams) || {};
  const meT = t[me.tid] || {}, nm = meT.name || me.name || "";
  const lookKey = JSON.stringify([nm, meT.pic || "", meT.sig || ""]);
  if ($("teamName").dataset.k !== lookKey){
    $("teamName").dataset.k = lookKey;
    $("meAv").replaceChildren(avatarEl(meT.pic, nm, 64));
    const sg = signatureEl(meT.sig, nm);
    $("teamName").replaceChildren(sg || document.createTextNode(nm));
  }
  $("clueTxt").innerHTML = "";
  if (r.status && r.status !== "idle" && r.cat){
    $("clueTxt").textContent = r.cat;
    const v = document.createElement("span"); v.className = "v"; v.textContent = "$" + r.value; $("clueTxt").appendChild(v);
  }
  if (pendingRid && pendingRid !== r.rid) pendingRid = null;
  const btn = $("buzzBtn"), st = $("statusTxt");
  btn.className = "buzz"; st.className = "status";
  let label = "Wait", text = "", live = false;
  if (conn !== "live"){
    btn.textContent = label; btn.disabled = true; btn.setAttribute("aria-label", "Buzzer unavailable");
    setText(st, conn === "error" ? "Can't reach the game" : "Reconnecting…"); st.classList.add("bad");
    return;
  }
  const fjI = game && game.final && game.final.id ? game.final : null;
  $("fjPanel").hidden = !fjI;
  if (fjI){ $("tossPanel").hidden = true; $("pickPanel").hidden = true; btn.hidden = true; document.querySelector("#playView .hint").hidden = true; $("clueTxt").textContent = ""; renderFinal(fjI); setText(st, ""); return; }
  const tsI = tossInfo();
  $("tossPanel").hidden = !tsI;
  if (tsI){ $("pickPanel").hidden = true; btn.hidden = true; document.querySelector("#playView .hint").hidden = true; renderToss(tsI); setText(st, ""); return; }
  const bd = (game && game.board) || null;
  const idle = !r.status || r.status === "idle";
  const myPick = idle && bd && bd.control === me.tid && Array.isArray(bd.cats) && Object.values(bd.left || {}).some(a => a.some(Boolean));
  $("pickPanel").hidden = !myPick; btn.hidden = !!myPick; document.querySelector("#playView .hint").hidden = !!myPick;
  if (!idle){ pickCat = null; pickSent = null; }
  if (myPick){ renderPicker(bd); setText(st, ""); return; }
  const order = r.rid && game.buzzes && game.buzzes[r.rid] ? Object.entries(game.buzzes[r.rid]).sort((a,b) => a[1].at - b[1].at).map(x => x[0]) : [];
  if (r.status === "open"){
    if (out){ text = "Locked out on this clue"; st.classList.add("bad"); }
    else if (mine || pendingRid === r.rid){ label = "Buzzed"; btn.classList.add("pending"); text = "Buzzed in! Waiting for the host…"; }
    else { label = "Buzz!"; live = true; text = "Buzzers are open"; }
  } else if (r.status === "answering"){
    if (r.first === me.tid){ label = "You're up"; btn.classList.add("up"); text = "Answer out loud!"; st.classList.add("good"); }
    else {
      const who = (t[r.first] && t[r.first].name) || "Another team";
      const pos = order.indexOf(me.tid);
      text = `${who} buzzed first` + (pos > 0 ? ` · you were #${pos + 1}` : "");
    }
  } else if (r.status === "locked"){
    text = r.first === me.tid && r.result === "correct" ? "Correct!" : "Clue closed";
    if (r.first === me.tid && r.result === "correct") st.classList.add("good");
  } else {
    const who = bd && bd.control && bd.control !== me.tid && t[bd.control] && t[bd.control].name;
    const wonToss = !!game && !!game.toss && game.toss.status === "done" && game.toss.winner === bd?.control && Object.values(bd?.left || {}).every(a => a.every(Boolean));
    text = who ? (wonToss ? `${who} won the coin toss and is picking the first clue…` : `${who} is picking the next clue…`) : "Waiting for the next clue";
  }
  btn.textContent = label; btn.disabled = !live;
  btn.setAttribute("aria-label", live ? "Buzz in" : label);
  setText(st, text);
}

/* ---------- start ---------- */
if (code && me.name && me.code === code){
  // rejoin silently after a refresh
  db.get(`games/${code}/teams/${me.tid}`).then(t => {
    if (t){ startListening(); joined = true; startHeartbeat(); showPlay(); }
    else showJoin();
  }).catch(() => showJoin("Couldn't connect. Check your internet and try again."));
} else showJoin();
</script>
